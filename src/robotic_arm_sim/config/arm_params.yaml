arm_controller:
  ros__parameters:
    test: true
    max_joint_velocity: 0.8       # rad/s, vitesse max d une articulation pendant une trajectoire
    min_trajectory_duration: 1.0  # s
    reset_cubes: ["blue_cube", "red_cube", "green_cube", "yellow_cube", "cyan_cube", "magenta_cube"]
    reset_area_x: [0.35, 1.0]      # m, zone de tirage aleatoire des cubes au reset (table2 : x 0.394 -> 1.194)
    reset_area_y: [-0.6, 0.6]       # m, table2 : y -0.75 -> 0.75 (toute la table est vue par la camera)
    reset_robot_xy: [0.2, 0.0]      # m, base du panda
    reset_reach: [0.3, 0.7]         # m, distance horizontale min (socle) / max (portee) a la base du robot
    reset_exclusion_zones: [0.5, 0.0, 0.2]  # x, y, rayon par zone ; ici la zone de depot de main_controller
    reset_base_z: 1.07              # m, z du centre d un cube pose sur la table
    cube_stack_step: 0.07           # m, cube de 0.06 + 0.01 de marge (le cube tombe sur celui du dessous)
    reset_min_spacing: 0.12         # m, distance min entre deux piles
    reset_stack_probability: 0.4    # proba de poser un cube sur une pile existante
